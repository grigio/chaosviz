<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020408">
<title>ENTROPY//viz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #020408;
    color: #cfeffc;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }
  #progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 11; pointer-events: none; }
  #progress i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #2ad9a0, #8fffc0);
    box-shadow: 0 0 12px rgba(80,255,190,.8);
    transition: width .1s linear;
  }
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    transition: opacity .25s;
  }
  #hud.hidden { opacity: 0; }
  #topbar {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    right: calc(12px + env(safe-area-inset-right));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none; /* keep the bar itself transparent to input */
  }
  #topbar #right, #topbar #pause-btn { pointer-events: auto; }
  #brand {
    font-size: 13px; letter-spacing: 3px; color: #7df;
    text-shadow: 0 0 12px rgba(80,220,255,.5);
  }
  #brand .cursor { animation: blink 1s steps(1) infinite; color: #0ff; }
  @keyframes blink { 50% { opacity: 0; } }
  #pool {
    display: block; margin-top: 3px; font-size: 9px; letter-spacing: 1px;
    color: rgba(160,220,240,.55); max-width: 62vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #ratebox { text-align: right; }
  #right { display: flex; align-items: center; gap: 10px; }
  #pause-btn {
    width: 36px; height: 36px; border-radius: 50%;
    font: inherit; font-size: 11px; color: #9fe; text-align: center;
    background: rgba(3,12,18,.72); border: 1px solid rgba(120,240,200,.28);
    cursor: pointer; touch-action: manipulation;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all .15s;
  }
  #pause-btn:hover { border-color: #8fffc0; color: #fff; }
  #pause-btn.paused { color: #ffd27d; border-color: rgba(255,210,125,.55); box-shadow: 0 0 12px rgba(255,210,125,.25); }
  #rate-num {
    font-size: 22px; color: #fff; line-height: 1;
    text-shadow: 0 0 14px rgba(120,255,220,.8);
  }
  #rate-label { display: block; margin-top: 3px; font-size: 9px; letter-spacing: 2px; color: rgba(160,220,240,.6); }
  #modes {
    position: absolute; bottom: calc(12px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; pointer-events: auto;
  }
  .mode-btn {
    font: inherit; letter-spacing: 2px; padding: 10px 12px; min-width: 44px;
    color: #9fe; background: rgba(3,12,18,.72);
    border: 1px solid rgba(120,240,200,.28); border-radius: 10px;
    cursor: pointer; touch-action: manipulation;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: all .15s;
  }
  .mode-btn.active {
    color: #04121a;
    background: linear-gradient(180deg, #8fffc0, #2ad9a0);
    border-color: #8fffc0;
    box-shadow: 0 0 18px rgba(80,255,190,.35);
  }
  .mode-btn:active { transform: scale(.96); }
  .mode-btn:focus-visible, .src:focus-visible, #gen-slider:focus-visible { outline: 1px solid #8fffc0; outline-offset: 2px; }
  #panel {
    position: absolute;
    top: calc(64px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    width: 300px; max-width: calc(100vw - 24px);
    max-height: calc(100vh - 160px); overflow-y: auto;
    pointer-events: auto;
    background: rgba(4,12,18,.82);
    border: 1px solid rgba(120,240,200,.22); border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    scrollbar-width: thin; scrollbar-color: rgba(120,240,200,.3) transparent;
  }
  #panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; font-size: 10px; letter-spacing: 2px; color: #9fe;
    cursor: pointer; user-select: none;
  }
  #panel-note { margin-left: auto; color: rgba(160,220,240,.4); font-size: 9px; letter-spacing: 1px; }
  #panel-arrow { color: rgba(160,220,240,.5); font-size: 10px; }
  #panel.collapsed #sources { display: none; }
  #sources { display: flex; flex-direction: column; border-top: 1px solid rgba(120,240,200,.12); }
  .src {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer; user-select: none;
    border-top: 1px dashed rgba(255,255,255,.06);
  }
  .src:first-child { border-top: none; }
  .src:hover { background: rgba(120,240,200,.05); }
  .src .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .src .nm { letter-spacing: 1px; color: #bfe; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src canvas { width: 72px; height: 20px; flex: none; }
  .src .val { min-width: 76px; text-align: right; color: #fff; flex: none; font-size: 11px; }
  .src .val small { color: rgba(160,220,240,.5); margin-left: 3px; font-size: 9px; }
  .src.off { opacity: .32; }
  .src.unavail { display: none; }
  #gen-ctl { padding: 10px 12px; border-top: 1px solid rgba(120,240,200,.12); }
  .ctl-row { display: flex; justify-content: space-between; align-items: baseline; }
  .ctl-row label { font-size: 9px; letter-spacing: 2px; color: #9fe; }
  #gen-val { font-size: 14px; color: #fff; }
  #gen-slider { width: 100%; margin: 8px 0 4px; accent-color: #2ad9a0; height: 20px; touch-action: manipulation; }
  #sysline { font-size: 9px; color: rgba(160,220,240,.5); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #history { width: 100%; height: 80px; margin-top: 8px; background: rgba(0,0,0,.35); border-radius: 6px; border: 1px solid rgba(120,240,200,.12); }
  #harvest { font-size: 9px; color: rgba(160,220,240,.45); margin-top: 6px; }
  #hint {
    position: absolute;
    bottom: calc(12px + env(safe-area-inset-bottom));
    right: calc(12px + env(safe-area-inset-right));
    font-size: 9px; letter-spacing: 1px; color: rgba(160,220,240,.35);
  }
  @media (max-width: 640px) {
    #brand { font-size: 12px; }
    #rate-num { font-size: 18px; }
    #panel { width: 280px; max-height: calc(100vh - 180px); }
    .mode-btn { padding: 9px 8px; min-width: 40px; letter-spacing: 1px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="progress"><i></i></div>
<div id="hud">
  <header id="topbar">
    <div>
      <div id="brand">ENTROPY<span class="cursor">_</span></div>
      <div id="pool"></div>
    </div>
    <div id="right">
      <div id="ratebox"><span id="rate-num">0</span><span id="rate-label">BITS/S</span></div>
      <button id="pause-btn" title="pause / resume (p)">❚❚</button>
    </div>
  </header>
  <nav id="modes">
    <button class="mode-btn" data-mode="noise">NOISE</button>
    <button class="mode-btn active" data-mode="particles">PARTICLES</button>
  </nav>
  <aside id="panel">
    <div id="panel-head"><span>SOURCES</span><span id="panel-note">tap to toggle</span><span id="panel-arrow">▾</span></div>
    <div id="sources"></div>
    <div id="gen-ctl">
      <div class="ctl-row"><label>GENERATION</label><span id="gen-val">10s</span></div>
      <input id="gen-slider" type="range" min="2" max="60" step="1" value="10">
      <div id="sysline"></div>
      <canvas id="history" width="300" height="80"></canvas>
      <div id="harvest"></div>
    </div>
  </aside>
  <footer id="hint">h hud · p pause · 1-2 modes</footer>
</div>
<script>
'use strict';

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a ? a : (v>b ? b : v);
const fmt = n => n>=1e6 ? (n/1e6).toFixed(2)+'M' : n>=1e3 ? (n/1e3).toFixed(1)+'k' : Math.round(n)+'';
const fmtBytes = n => n>=1048576 ? (n/1048576).toFixed(2)+' MiB' : n>=1024 ? (n/1024).toFixed(1)+' KiB' : n+' B';

/* ================= entropy pool ================= */
const Pool = {
  state: new Uint32Array(16),
  n: 0,
  totalBytes: 0,
  counter: 0,
  add(x) {
    this.state[this.n & 15] ^= (x >>> 0);
    this.n++; this.totalBytes += 4;
    if ((this.n & 3) === 0) this.stir();
  },
  addBytes(b) {
    for (let i = 0; i < b.length; i++) { this.state[this.n & 15] ^= b[i]; this.n++; }
    this.totalBytes += b.length;
    this.stir();
  },
  stir() {
    for (let i = 0; i < 16; i++) {
      let x = this.state[i];
      x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
      this.state[i] = (x + this.state[(i + 7) & 15]) | 0;
    }
  },
  getBytes(n) {
    // counter-mode stream: hash(pool state, block counter) -> 64 fresh bytes per block.
    // No 64-byte periodicity, and with a frozen pool each call still yields a
    // deterministic stream that advances via the counter.
    const out = new Uint8Array(n);
    const s = this.state.slice();
    let counter = this.counter >>> 0;
    let oi = 0;
    while (oi < n) {
      const h = s.slice();
      h[0] = (h[0] + counter) | 0;
      h[1] = (h[1] + ((counter * 0x85ebca6b) | 0)) | 0;
      for (let i = 0; i < 16; i++) {
        h[i] = (h[i] + 0x9e3779b9 + ((i * 0x85ebca6b) | 0)) | 0;
        h[i] = ((h[i] << 13) | (h[i] >>> 19)) ^ h[(i + 5) & 15];
      }
      for (let i = 0; i < 16 && oi < n; i++) {
        const w = h[i];
        out[oi++] = w & 255;
        if (oi < n) out[oi++] = (w >>> 8) & 255;
        if (oi < n) out[oi++] = (w >>> 16) & 255;
        if (oi < n) out[oi++] = (w >>> 24) & 255;
      }
      counter = (counter + 1) >>> 0;
    }
    this.counter = counter;
    return out;
  }
};
// seed with a few constants + real randomness if available
Pool.add(0x9e3779b9); Pool.add(0x85ebca6b); Pool.add(0xc2b2ae35);
try { Pool.addBytes(crypto.getRandomValues(new Uint8Array(512))); } catch (e) {}

let _pr = Pool.getBytes(4096), _pi = 0;
function prng() {
  if (_pi >= _pr.length) { _pr = Pool.getBytes(4096); _pi = 0; }
  return _pr[_pi++] / 256; // always < 1, so (prng()*N)|0 stays in [0, N-1]
}
function crBytes(n) {
  try { return crypto.getRandomValues(new Uint8Array(n)); }
  catch (e) { return Pool.getBytes(n); }
}

/* ================= entropy estimator ================= */
function makeEstimator(maxBps, shift) {
  const e = { maxBps, shift: shift || 0, bps: 0, eps: 0, bpe: 1, last: null, hist: new Float64Array(16), hn: 0 };
  e.note = function (now) {
    if (this.last != null) {
      const dt = now - this.last;
      if (dt > 0 && dt < 1e5) {
        const us = (dt * 1000) | 0;
        const b = (us >> this.shift) & 15;
        this.hist[b]++; this.hn++;
        if (this.hn >= 64) {
          let H = 0;
          for (let i = 0; i < 16; i++) { const p = this.hist[i] / this.hn; if (p > 0) H -= p * Math.log2(p); }
          this.bpe = this.bpe * 0.7 + H * 0.3;
          this.hist.fill(0); this.hn = 0;
        }
        const inst = 1000 / Math.max(dt, 0.01);
        this.eps = this.eps * 0.9 + inst * 0.1;
        this.bps = this.bps * 0.9 + Math.min(this.bpe * this.eps, this.maxBps) * 0.1;
      }
    }
    this.last = now;
    return this.bps;
  };
  return e;
}

/* ================= sources ================= */
const SRC = {};
const ORDER = ['timer', 'pointer', 'keys', 'cpu', 'crypto'];
const SRC_COLORS = {
  timer: '#8fffc0', pointer: '#7fd7ff', keys: '#ffd27d', cpu: '#ff8f8f',
  crypto: '#d99fff'
};
function defSrc(key, name, unit, max, opts) {
  const s = Object.assign({
    key, name, unit, max,
    enabled: true, available: true, gauge: false,
    bps: 0, value: 0, spark: [], color: SRC_COLORS[key] || '#8fffc0',
    row: null, canvas: null, valEl: null
  }, opts || {});
  if (!s.gauge) s.est = makeEstimator(s.max, s.shift || 0);
  SRC[key] = s;
  return s;
}
const timerS = defSrc('timer',  'TIME',    'bits/s', 3000);
const ptrS   = defSrc('pointer','POINTER', 'bits/s', 6000);
const keyS   = defSrc('keys',   'KEYS',    'bits/s', 600);
const cpuS   = defSrc('cpu',    'CPU LOAD','%',      100, { gauge: true });
const rngS   = defSrc('crypto', 'HW RNG',  'MiB/s',  16,  { gauge: true });

const srcList = [];
function buildSources() {
  const el = $('#sources');
  for (const key of ORDER) {
    const s = SRC[key];
    const row = document.createElement('div');
    row.className = 'src' + (s.enabled ? '' : ' off');
    row.innerHTML =
      '<span class="dot" style="background:' + s.color + ';box-shadow:0 0 8px ' + s.color + '"></span>' +
      '<span class="nm">' + s.name + '</span>' +
      '<canvas width="72" height="20"></canvas>' +
      '<span class="val"><b>0</b><small>' + s.unit + '</small></span>';
    row.addEventListener('click', () => {
      if (!s.available) return;
      s.enabled = !s.enabled;
      row.classList.toggle('off', !s.enabled);
    });
    s.row = row; s.valEl = row.querySelector('.val b'); s.canvas = row.querySelector('canvas');
    s.dot = row.querySelector('.dot');
    el.appendChild(row);
    srcList.push(s);
  }
}
function updateAvail() {
  for (const s of srcList) {
    s.row.classList.toggle('unavail', !s.available);
    if (!s.available) s.enabled = false;
  }
}

/* ================= harvesters ================= */
setInterval(() => {
  if (!timerS.enabled) return;
  const t = performance.now();
  timerS.bps = timerS.est.note(t);
  timerS.lastSample = t;
  Pool.add((t * 1000) | 0);
}, 4);

const ptr = { x: -1, y: -1, lx: -1, ly: -1, lt: 0, speed: 0 };
addEventListener('pointermove', e => {
  if (!ptrS.enabled) return;
  const t = performance.now();
  const x = e.clientX, y = e.clientY;
  if (ptr.lx >= 0 && t > ptr.lt) {
    const dt = (t - ptr.lt) / 1000;
    const sp = Math.hypot(x - ptr.lx, y - ptr.ly) / dt;
    ptr.speed = ptr.speed * 0.7 + sp * 0.3;
  }
  ptr.lx = x; ptr.ly = y; ptr.lt = t; ptr.x = x; ptr.y = y;
  // pointer entropy = velocity, so the visuals track how fast the mouse moves
  ptrS.bps = Math.min(ptr.speed * 0.8, ptrS.max);
  ptrS.lastSample = t;
  Pool.add((((x * 2654435761) ^ (y * 40503) ^ ((t * 1000) | 0) ^ ((ptr.speed * 97) | 0)) >>> 0));
  // paint colored squares directly on the canvas along the pointer path
  paintAt(x, y, 0);
}, { passive: true });
addEventListener('pointerdown', e => {
  if (!ptrS.enabled) return;
  const t = performance.now();
  const x = e.clientX, y = e.clientY;
  ptr.lx = x; ptr.ly = y; ptr.lt = t; ptr.x = x; ptr.y = y;
  ptrS.bps = Math.min(ptr.speed * 0.8 + 200, ptrS.max);
  ptrS.lastSample = t;
  Pool.add((((x * 40503) ^ ((t * 1000) | 0)) >>> 0));
  if (mode === 'particles') chaosErode(x, y, 70, 1.6); // click collides: erode CHAOS near the cursor
  paintAt(x, y, 1.6); // clicking leaves a bigger splat
}, { passive: true });

addEventListener('keydown', e => {
  if (keyS.enabled) {
    const t = performance.now();
    keyS.bps = keyS.est.note(t);
    keyS.lastSample = t;
    Pool.add(((e.keyCode * 40503) ^ ((t * 1000) | 0)) >>> 0);
  }
  if (e.key === 'h') { $('#hud').classList.toggle('hidden'); }
  else if (e.key === 'p') { togglePause(); }
  else if (e.key >= '1' && e.key <= '2') { setMode(MODES[+e.key - 1]); }
});

// CPU load probe
let cpuRef = 0;
function busy(dur) {
  const t0 = performance.now(); let c = 0;
  while (performance.now() - t0 < dur && c < 2e6) { let x = 0; for (let i = 0; i < 64; i++) x = (x * 31 + 7) | 0; c++; }
  return c;
}
cpuRef = busy(30);
setInterval(() => {
  if (!cpuS.enabled) return;
  const t0 = performance.now();
  const c = busy(20);
  const load = clamp(1 - c / cpuRef, 0, 1);
  cpuS.value = cpuS.value * 0.6 + load * 0.4 * 100;
  cpuS.bps = cpuS.value * 30;
  cpuS.lastSample = t0;
  Pool.add((c ^ ((t0 * 1000) | 0)) >>> 0);
}, 1000);

// HW RNG throughput (reference source)
setInterval(() => {
  if (!rngS.enabled) return;
  const arr = new Uint8Array(4096);
  const t0 = performance.now();
  try { crypto.getRandomValues(arr); } catch (e) { arr.set(Pool.getBytes(4096)); }
  const dt = Math.max(performance.now() - t0, 0.05);
  rngS.value = rngS.value * 0.7 + (arr.length / 1048576 / (dt / 1000)) * 0.3;
  rngS.bps = 800;
  rngS.lastSample = t0;
  Pool.addBytes(arr);
}, 500);

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

/* ================= HUD tick ================= */
const MAX_RATE = 5000;
let E = 0, Eraw = 0, flash = 0, paused = false;
const hist = [];
const histCtx = $('#history').getContext('2d');
let genDuration = 10, genT = 0, genProgress = 0;
const progressEl = $('#progress i');

function drawSpark(s) {
  const c = s.canvas.getContext('2d'), w = c.canvas.width, h = c.canvas.height;
  c.clearRect(0, 0, w, h);
  const d = s.spark, max = s.max;
  if (d.length < 2) return;
  c.strokeStyle = s.color; c.lineWidth = 1.2; c.beginPath();
  for (let i = 0; i < d.length; i++) {
    const x = (i / (d.length - 1)) * w;
    const y = h - clamp(d[i] / max, 0, 1) * (h - 2) - 1;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.stroke();
}
function drawHist() {
  const w = histCtx.canvas.width, h = histCtx.canvas.height;
  histCtx.clearRect(0, 0, w, h);
  histCtx.strokeStyle = 'rgba(120,240,200,.12)'; histCtx.lineWidth = 1;
  histCtx.beginPath();
  for (let i = 1; i < 4; i++) { histCtx.moveTo(0, i * h / 4); histCtx.lineTo(w, i * h / 4); }
  histCtx.stroke();
  const d = hist;
  if (d.length < 2) return;
  histCtx.beginPath();
  for (let i = 0; i < d.length; i++) {
    const x = (i / (d.length - 1)) * w;
    const y = h - clamp(d[i] / MAX_RATE, 0, 1) * (h - 2) - 1;
    i ? histCtx.lineTo(x, y) : histCtx.moveTo(x, y);
  }
  histCtx.strokeStyle = '#8fffc0'; histCtx.lineWidth = 1.5; histCtx.stroke();
}
function hexBytes(n) {
  let out = '';
  const b = Pool.getBytes(n);
  for (let i = 0; i < b.length; i++) out += (b[i] < 16 ? '0' : '') + b[i].toString(16);
  return out;
}
function sysLine() {
  return 'SYS ' + (navigator.hardwareConcurrency || '?') + 'C / ' + (navigator.deviceMemory || '?') +
    'GB \u00b7 ' + (navigator.onLine ? 'ONLINE' : 'OFFLINE') +
    ' \u00b7 ' + (devicePixelRatio || 1).toFixed(1) + '\u00d7 \u00b7 ' + W + '\u00d7' + H;
}
setInterval(() => {
  // decay any source that has gone quiet, so visuals freeze shortly after input
  // stops (a rate is only real while samples keep arriving)
  const nowMs = performance.now();
  for (const s of srcList) {
    if (s.lastSample != null && nowMs - s.lastSample > 150) {
      const f = Math.pow(0.5, (nowMs - s.lastSample) / 400);
      s.bps *= f;
      if (s.est) s.est.bps = s.bps;
    }
  }
  let total = 0;
  for (const s of srcList) if (s.enabled && s.available) total += s.bps;
  total = Math.min(total, MAX_RATE);
  $('#rate-num').textContent = Math.round(total);
  $('#pool').textContent = hexBytes(16);
  $('#harvest').textContent = 'pool ' + fmtBytes(Pool.totalBytes) + ' mixed';
  $('#sysline').textContent = sysLine();
  Eraw = total / MAX_RATE;
  E = E * 0.6 + Eraw * 0.4;
  hist.push(total);
  if (hist.length > 240) hist.shift();
  drawHist();
  for (const s of srcList) {
    s.spark.push(s.gauge ? s.value : s.bps);
    if (s.spark.length > 60) s.spark.shift();
    s.valEl.textContent = s.gauge ? s.value.toFixed(1) : fmt(s.bps);
    drawSpark(s);
  }
}, 250);

/* ================= generation ================= */
const MODES = ['noise', 'particles'];
let mode = 'particles';

function togglePause() {
  paused = !paused;
  $('#pause-btn').textContent = paused ? '\u25b6' : '\u275a\u275a';
  $('#pause-btn').classList.toggle('paused', paused);
}

function resetGeneration() {
  genT = 0; genProgress = 0;
  partReset(); grainReset(); chaosReset();
}
function completeGeneration() {
  flash = Math.max(flash, 0.9);
  resetGeneration();
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  flash = Math.max(flash, 0.3);
  resetGeneration();
}
/* ================= particles mode ================= */
const part = {
  max: 1000, n: 0,
  x: new Float32Array(1600), y: new Float32Array(1600),
  vx: new Float32Array(1600), vy: new Float32Array(1600),
  ph: new Float32Array(1600)
};
// CHAOS art formed by anchored white particles; entropy releases them so the
// letters dissolve into the storm, mirroring the noise view's deterioration
const chaos = {
  n: 0,
  x: new Float32Array(1400), y: new Float32Array(1400),
  vx: new Float32Array(1400), vy: new Float32Array(1400),
  ph: new Float32Array(1400), free: new Uint8Array(1400)
};
function partAdapt() { part.max = clamp(Math.round(W * H / 900) | 0, 400, 1600); }
function partReset() { part.n = 0; }
function chaosReset() {
  chaos.n = 0;
  const bm = art.bitmap;
  if (!bm) return;
  const total = art.remaining;
  const target = Math.min(chaos.x.length, Math.max(200, Math.round(total * 0.04)));
  const k = Math.max(1, Math.round(total / target));
  let c = 0;
  for (let i = 0; i < bm.length && chaos.n < target; i++) {
    if (bm[i]) {
      c++;
      if (c % k === 0) {
        const idx = chaos.n++;
        chaos.x[idx] = (i % W) + (prng() - 0.5) * 2;
        chaos.y[idx] = ((i / W) | 0) + (prng() - 0.5) * 2;
        chaos.vx[idx] = 0; chaos.vy[idx] = 0;
        chaos.ph[idx] = prng();
        chaos.free[idx] = 0;
      }
    }
  }
}
function updateChaos(dt) {
  if (!chaos.n) return;
  const T = E;
  // release anchored art particles as entropy flows (the CHAOS dissolves)
  if (nowT >= art.holdUntil) {
    const nRel = Math.max(1, Math.round(chaos.n * Math.min(1, (0.02 + T * 0.5) * dt)));
    for (let r = 0; r < nRel; r++) {
      const idx = (prng() * chaos.n) | 0;
      if (!chaos.free[idx]) {
        chaos.free[idx] = 1;
        chaos.vx[idx] = (prng() - 0.5) * 3;
        chaos.vy[idx] = (prng() - 0.5) * 3;
      }
    }
  }
  const jx = 0.25 + T * 2.2, flow = 0.5 + T * 1.6;
  for (let i = 0; i < chaos.n; i++) {
    if (!chaos.free[i]) continue;
    const x = chaos.x[i], y = chaos.y[i];
    const fx = Math.sin(x * 0.004 + nowT * 0.5) + Math.cos(y * 0.003 - nowT * 0.4);
    const fy = Math.cos(y * 0.004 + nowT * 0.45) + Math.sin(x * 0.003 - nowT * 0.35);
    chaos.vx[i] = chaos.vx[i] * 0.88 + fx * 0.05 * flow + (prng() - 0.5) * jx;
    chaos.vy[i] = chaos.vy[i] * 0.88 + fy * 0.05 * flow + (prng() - 0.5) * jx;
    const sp = Math.hypot(chaos.vx[i], chaos.vy[i]), mx = 0.8 + T * 2.4;
    if (sp > mx) { chaos.vx[i] *= mx / sp; chaos.vy[i] *= mx / sp; }
    chaos.x[i] += chaos.vx[i]; chaos.y[i] += chaos.vy[i];
    if (chaos.x[i] < 0) chaos.x[i] += W; else if (chaos.x[i] >= W) chaos.x[i] -= W;
    if (chaos.y[i] < 0) chaos.y[i] += H; else if (chaos.y[i] >= H) chaos.y[i] -= H;
  }
}
function chaosErode(sx, sy, radius, strength) {
  // collision: release anchored white CHAOS particles near the point and push
  // them outward, eroding the letters faster right where the pointer hits
  if (!chaos.n) return;
  const r2 = radius * radius;
  const push = 6 * (strength || 1);
  for (let i = 0; i < chaos.n; i++) {
    if (chaos.free[i]) continue;
    const dx = chaos.x[i] - sx, dy = chaos.y[i] - sy;
    const d2 = dx * dx + dy * dy;
    if (d2 < r2) {
      const d = Math.sqrt(d2) || 1;
      chaos.free[i] = 1;
      chaos.vx[i] = (dx / d) * push + (prng() - 0.5) * 2;
      chaos.vy[i] = (dy / d) * push + (prng() - 0.5) * 2;
    }
  }
}
function partSpawnAt(sx, sy, boost) {
  // the pointer paints particles directly onto the canvas
  const n = Math.max(1, Math.round((4 + ptr.speed * 0.01) * (1 + (boost || 0))));
  for (let i = 0; i < n && part.n < part.max; i++) {
    const idx = part.n++;
    part.x[idx] = sx + (prng() - 0.5) * 14;
    part.y[idx] = sy + (prng() - 0.5) * 14;
    part.vx[idx] = (prng() - 0.5) * 3;
    part.vy[idx] = (prng() - 0.5) * 3;
    part.ph[idx] = prng();
  }
}
function updateParticles(dt) {
  const target = Math.min(Math.round(part.max * genProgress), part.max);
  if (part.n < target) {
    const add = Math.min(target - part.n, Math.max(1, Math.ceil(part.max * dt / genDuration) + 1));
    for (let i = 0; i < add; i++) {
      const idx = part.n++;
      part.x[idx] = prng() * W; part.y[idx] = prng() * H;
      part.vx[idx] = (prng() - 0.5) * 2; part.vy[idx] = (prng() - 0.5) * 2;
      part.ph[idx] = prng();
    }
  } else if (part.n > target) part.n = target;
  const T = E;
  const jx = 0.25 + T * 2.2, flow = 0.5 + T * 1.6;
  for (let i = 0; i < part.n; i++) {
    const x = part.x[i], y = part.y[i];
    const fx = Math.sin(x * 0.004 + nowT * 0.5) + Math.cos(y * 0.003 - nowT * 0.4);
    const fy = Math.cos(y * 0.004 + nowT * 0.45) + Math.sin(x * 0.003 - nowT * 0.35);
    part.vx[i] = part.vx[i] * 0.88 + fx * 0.05 * flow + (prng() - 0.5) * jx;
    part.vy[i] = part.vy[i] * 0.88 + fy * 0.05 * flow + (prng() - 0.5) * jx;
    const sp = Math.hypot(part.vx[i], part.vy[i]), mx = 0.8 + T * 2.4;
    if (sp > mx) { part.vx[i] *= mx / sp; part.vy[i] *= mx / sp; }
    part.x[i] += part.vx[i]; part.y[i] += part.vy[i];
    if (part.x[i] < 0) part.x[i] += W; else if (part.x[i] >= W) part.x[i] -= W;
    if (part.y[i] < 0) part.y[i] += H; else if (part.y[i] >= H) part.y[i] -= H;
  }
}
function drawParticles() {
  ctx.fillStyle = 'rgba(2,4,8,0.32)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const T = E;
  // anchored CHAOS art particles stay white; released ones join the colored storm
  for (let i = 0; i < chaos.n; i++) {
    ctx.fillStyle = chaos.free[i]
      ? 'hsla(' + Math.round((chaos.ph[i] * 360 + T * 140) % 360) + ',90%,' + (50 + T * 16) + '%,0.8)'
      : 'rgba(255,255,255,0.9)';
    ctx.fillRect(chaos.x[i], chaos.y[i], 2, 2);
  }
  for (let i = 0; i < part.n; i++) {
    ctx.fillStyle = 'hsla(' + Math.round((part.ph[i] * 360 + T * 140) % 360) + ',90%,' + (50 + T * 16) + '%,' + (0.12 + T * 0.25) + ')';
    ctx.fillRect(part.x[i], part.y[i], 2, 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ================= noise mode ================= */
// thick block-letter CHAOS in pure ASCII (5 lines x 33 cols), renders anywhere
const CHAOS_ART = [
  '█████  ██ ██   ███    ███   █████',
  '██     ██ ██  ██ ██  ██ ██  ██   ',
  '██     █████  █████  ██ ██  █████',
  '██     ██ ██  ██ ██  ██ ██     ██',
  '█████  ██ ██  ██ ██   ███   █████'
];
const grain = { cw: 128, ch: 72, cv: null, gctx: null, img: null };
// precomputed RGB palette covering the full hue wheel (index = byte value)
const grainPal = new Uint8ClampedArray(256 * 3);
for (let i = 0; i < 256; i++) {
  const hue = (i / 255) * 360;
  const c = (1 - Math.abs(2 * 50 / 100 - 1)) * (85 / 100);
  const x = c * (1 - Math.abs(((hue / 60) % 2) - 1));
  const m = 0.5 - c / 2;
  let r, g, b;
  if (hue < 60) { r = c; g = x; b = 0; }
  else if (hue < 120) { r = x; g = c; b = 0; }
  else if (hue < 180) { r = 0; g = c; b = x; }
  else if (hue < 240) { r = 0; g = x; b = c; }
  else if (hue < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  grainPal[i * 3] = Math.round((r + m) * 255);
  grainPal[i * 3 + 1] = Math.round((g + m) * 255);
  grainPal[i * 3 + 2] = Math.round((b + m) * 255);
}
function grainInit() {
  if (W < 600) { grain.cw = 256; grain.ch = 144; } else { grain.cw = 320; grain.ch = 180; }
  grain.cv = document.createElement('canvas');
  grain.cv.width = grain.cw; grain.cv.height = grain.ch;
  grain.gctx = grain.cv.getContext('2d');
  grain.img = grain.gctx.createImageData(grain.cw, grain.ch);
  fillGrain(true); // the initial pixel state is black
}
function fillGrain(black) {
  const d = grain.img.data;
  if (black) {
    d.fill(0);
    for (let i = 3; i < d.length; i += 4) d[i] = 255;
    grain.gctx.putImageData(grain.img, 0, 0);
    return;
  }
  const buf = Pool.getBytes(grain.cw * grain.ch * 2); // bytes come from the harvested pool
  for (let i = 0; i < grain.cw * grain.ch; i++) {
    const h = buf[i * 2], f = 0.45 + 0.55 * (buf[i * 2 + 1] / 255);
    const o = i * 3, p = h * 3;
    d[i * 4] = grainPal[p] * f; d[i * 4 + 1] = grainPal[p + 1] * f; d[i * 4 + 2] = grainPal[p + 2] * f; d[i * 4 + 3] = 255;
  }
  grain.gctx.putImageData(grain.img, 0, 0);
}
function grainReset() {
  fillGrain(true);
  artReset(); // every generation starts with black + white CHAOS
}
function tickGrain(frac) {
  const len = grain.cw * grain.ch;
  const k = Math.max(1, Math.round(len * frac));
  const buf = Pool.getBytes(k * 2); // bytes come from the harvested pool
  // horizontal cursor position sets the global color phase; entropy sweeps it over time
  const rot = (((ptr.x >= 0 ? ptr.x / W : 0) * 256 + nowT * 20 * E) | 0) % 256;
  // the static boils in a patch around the cursor; the patch grows with velocity
  // (grain screen geometry comes from grain.ox/oy/scale set in drawNoise)
  const gx0 = (ptr.x - grain.ox) / grain.scale, gy0 = (ptr.y - grain.oy) / grain.scale;
  const gr = clamp((40 + ptr.speed * 0.06) / grain.scale, 1, grain.cw * 0.5);
  const data = grain.img.data;
  // colored pixels that land on the CHAOS art erase it: the art disappears
  // because new colored squares come, not on its own
  const eatArt = art.remaining > 0 && nowT >= art.holdUntil;
  const cellW = Math.ceil(grain.scale), cellH = Math.ceil(grain.scale);
  let bi = 0;
  for (let j = 0; j < k; j++) {
    let px, py;
    if (ptr.x >= 0 && prng() < 0.75) {
      const ang = prng() * Math.PI * 2;
      const r = gr * Math.sqrt(prng());
      px = ((gx0 + Math.cos(ang) * r) % grain.cw + grain.cw) % grain.cw;
      py = ((gy0 + Math.sin(ang) * r) % grain.ch + grain.ch) % grain.ch;
    } else {
      px = (prng() * grain.cw) | 0;
      py = (prng() * grain.ch) | 0;
    }
    const idx = py * grain.cw + px;
    if (eatArt) eraseArtAt(px, py);
    const h = (buf[bi++] + rot) % 256;
    const f = 0.7 + 0.3 * (buf[bi++] / 255);
    const p = h * 3, o = idx * 4;
    data[o] = grainPal[p] * f;
    data[o + 1] = grainPal[p + 1] * f;
    data[o + 2] = grainPal[p + 2] * f;
    data[o + 3] = 255;
  }
  grain.gctx.putImageData(grain.img, 0, 0);
}

/* ---------- direct painting: the pointer draws colored squares on the canvas ---------- */
function eraseArtAt(px, py) {
  // this colored square covers a square region of the art layer: erase it there
  const x0 = Math.max(0, Math.floor(grain.ox + px * grain.scale));
  const y0 = Math.max(0, Math.floor(grain.oy + py * grain.scale));
  const x1 = Math.min(W, Math.ceil(grain.ox + (px + 1) * grain.scale));
  const y1 = Math.min(H, Math.ceil(grain.oy + (py + 1) * grain.scale));
  art.ctx.clearRect(x0, y0, x1 - x0, y1 - y0);
  const bm = art.bitmap;
  for (let ay = y0; ay < y1; ay++) {
    const row = ay * W;
    for (let ax = x0; ax < x1; ax++) if (bm[row + ax]) { bm[row + ax] = 0; art.remaining--; }
  }
}
function writeGrainCell(px, py, rot, bright) {
  const cw = grain.cw, ch = grain.ch;
  px = ((px % cw) + cw) % cw;
  py = ((py % ch) + ch) % ch;
  const idx = py * cw + px;
  const h = (((prng() * 256) | 0) + rot) % 256;
  const f = 0.5 + 0.5 * bright * (0.7 + 0.3 * prng());
  const p = h * 3, o = idx * 4, d = grain.img.data;
  d[o] = grainPal[p] * f; d[o + 1] = grainPal[p + 1] * f; d[o + 2] = grainPal[p + 2] * f; d[o + 3] = 255;
  if (art.remaining > 0 && nowT >= art.holdUntil) eraseArtAt(px, py);
}
function paintBrush(gx, gy, speed, boost) {
  const r = clamp(0.6 + (speed * 0.0012 + (boost || 0)) * 1.4, 0.6, 4.5); // brush radius in grain cells
  const bright = 0.55 + 0.45 * Math.min(1, speed / 1600);
  const rot = (((ptr.x >= 0 ? ptr.x / W : 0) * 256) | 0) % 256;
  const n = Math.max(1, Math.round(r * r * Math.PI * (0.6 + 0.4 * Math.min(1, speed / 1600))));
  for (let i = 0; i < n; i++) {
    const ang = prng() * Math.PI * 2;
    const rad = r * Math.sqrt(prng());
    writeGrainCell(Math.round(gx + Math.cos(ang) * rad), Math.round(gy + Math.sin(ang) * rad), rot, bright);
  }
  grain.gctx.putImageData(grain.img, 0, 0);
}
function paintAt(sx, sy, boost) {
  if (mode === 'particles') {
    chaosErode(sx, sy, 24 + ptr.speed * 0.02, 0.7); // the paint spray collides with the white particles
    partSpawnAt(sx, sy, boost); // paint particles directly
    return;
  }
  if (!grain.scale) return; // screen geometry not ready yet
  const gx = (sx - grain.ox) / grain.scale;
  const gy = (sy - grain.oy) / grain.scale;
  if (!isFinite(gx) || !isFinite(gy)) return;
  paintBrush(gx, gy, ptr.speed, boost);
}

/* ---------- CHAOS art: white art eaten by arriving colored squares ---------- */
const ART_HOLD_S = 1.0; // fresh art is protected from colored squares for a moment
const art = { cv: null, ctx: null, img: null, bitmap: null, remaining: 0, holdUntil: 0 };
function artReset() {
  if (!art.cv) {
    art.cv = document.createElement('canvas');
    art.cv.width = W; art.cv.height = H;
    art.ctx = art.cv.getContext('2d');
  }
  art.ctx.save();
  art.ctx.clearRect(0, 0, W, H); // transparent background: only the white art shows
  // fit the thick art (33 cols x 5 lines) with generous margins, always centered
  const fs = Math.max(12, Math.floor(Math.min(W / 40, H / 8)));
  art.ctx.fillStyle = '#ffffff';
  art.ctx.font = fs + 'px ui-monospace,monospace';
  art.ctx.textAlign = 'center';
  art.ctx.textBaseline = 'middle';
  const lineH = fs * 1.18;
  const top = H / 2 - (CHAOS_ART.length * lineH) / 2 + fs * 0.4;
  for (let i = 0; i < CHAOS_ART.length; i++) art.ctx.fillText(CHAOS_ART[i], W / 2, top + i * lineH);
  art.ctx.restore();
  // bitmap of surviving art pixels; colored squares zero out the cells they cover
  art.img = art.ctx.getImageData(0, 0, W, H);
  const bm = art.bitmap = new Uint8Array(W * H);
  const d = art.img.data;
  let n = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] > 100 || d[i + 1] > 100 || d[i + 2] > 100) { bm[i >> 2] = 1; n++; }
  }
  art.remaining = n;
  art.holdUntil = nowT + ART_HOLD_S;
}
function drawNoise() {
  // full-opacity, full-spectrum colored static; entropy drives the boil rate.
  // The grain is scaled uniformly (cover) so the colored squares stay square
  // on any canvas size, centered with overflow cropped. The white CHAOS art
  // sits on top; each colored square that lands on it erases that part.
  // integer scale so every colored square is exactly the same size (a fractional
  // cover scale would make nearest-neighbor squares alternate between sizes)
  const scale = Math.max(1, Math.ceil(Math.max(W / grain.cw, H / grain.ch)));
  grain.ox = (W - grain.cw * scale) / 2;
  grain.oy = (H - grain.ch * scale) / 2;
  grain.scale = scale;
  if (E > 0.005) tickGrain(Math.min(0.8, 0.2 + E * 0.7));
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  ctx.drawImage(grain.cv, grain.ox, grain.oy, grain.cw * scale, grain.ch * scale);
  ctx.imageSmoothingEnabled = true;
  if (art.remaining > 0) ctx.drawImage(art.cv, 0, 0, W, H);
  ctx.globalAlpha = 1;
}
/* ================= render loop ================= */
const canvas = $('#scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, nowT = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  grainInit(); partAdapt();
  if (art.cv) artReset(); // rebuild the CHAOS art for the new size
  $('#sysline').textContent = sysLine();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (paused) return;
  nowT = now / 1000;
  genT += dt;
  if (genT >= genDuration) completeGeneration();
  genProgress = genT / genDuration;
  progressEl.style.width = (genProgress * 100) + '%';
  if (mode === 'particles') {
    updateChaos(dt);
    updateParticles(dt);
    drawParticles();
  } else if (mode === 'noise') {
    drawNoise();
  }
  if (flash > 0.001) {
    flash *= Math.exp(-dt * 2.5);
    const r = Math.max(W, H) * 0.7;
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r);
    g.addColorStop(0, 'rgba(170,255,235,' + (flash * 0.35) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

/* ================= init ================= */
buildSources();
updateAvail();
const genSlider = $('#gen-slider');
genSlider.addEventListener('input', () => {
  genDuration = +genSlider.value;
  $('#gen-val').textContent = genDuration + 's';
  resetGeneration();
});
const panel = $('#panel');
if (matchMedia('(max-width: 640px)').matches) panel.classList.add('collapsed');
$('#panel-head').addEventListener('click', () => {
  const collapsed = panel.classList.toggle('collapsed');
  $('#panel-arrow').textContent = collapsed ? '\u25b8' : '\u25be';
});
document.querySelectorAll('.mode-btn').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#pause-btn').addEventListener('click', togglePause);
resize();
resetGeneration();
requestAnimationFrame(frame);
</script>
